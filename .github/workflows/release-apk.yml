name: Gerar Release e APK do RealClima

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da Versão (ex: v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK e Publicar Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Web
        run: npm ci

      - name: Build Web de Produção
        run: npm run build

      - name: Sincronizar com Android (Capacitor)
        run: npx cap sync android

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar Permissão ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APKs Android
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: Preparar APKs para Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk realclima-${{ github.ref_name || inputs.tag_name }}-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk app-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Criar GitHub Release e Anexar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: RealClima ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            realclima-${{ github.ref_name || inputs.tag_name }}-release.apk
            app-release.apk
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
