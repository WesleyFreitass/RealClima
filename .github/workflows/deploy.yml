name: Deploy Automático RealClima na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar e Subir Container na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e Atualizar RealClima
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Atualizando RealClima na VPS..."
            cd /root/realclima
            git clean -fd
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker ps --filter "name=realclima-app"
            echo "✅ [CI/CD] Deploy do RealClima concluído com sucesso na porta 3060!"
